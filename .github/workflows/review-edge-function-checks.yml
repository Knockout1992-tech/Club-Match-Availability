name: Review branch Edge Function checks

on:
  push:
    branches:
      - phase-1-access-security-2026-11-19
  workflow_dispatch:

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check reviewed Edge Functions
        run: |
          deno check \
            supabase/functions/admin_fixtures/index.ts \
            supabase/functions/create_fixture/index.ts \
            supabase/functions/manage_match_child/index.ts \
            supabase/functions/publish_fixture/index.ts \
            supabase/functions/parent_home/index.ts
