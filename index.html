 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#123b2a">
    <title>Match Availability | Rushden & Higham RUFC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <img
            src="RHRFC.jpg"
            alt="Rushden & Higham RUFC crest"
            class="club-logo"
        >

        <div class="header-copy">
            <div class="club-name">RUSHDEN & HIGHAM RUFC</div>
            <div class="header-subtitle">MATCH AVAILABILITY</div>
        </div>
    </div>
</header>

    <main class="container">
        <section id="loading" class="panel">
            <p>Loading fixture details...</p>
        </section>

        <section id="fixture" class="panel" hidden>
            <p class="eyebrow">UPCOMING FIXTURE</p>
            <h1 id="opposition"></h1>
            <div id="fixture-details"></div>
        </section>

        <section id="availability-form" class="panel" hidden>
    <h2>Player availability</h2>
    <p>Please provide your details and tell us whether your child or children can attend.</p>

    <form id="submission-form">
        <div class="form-group">
            <label for="parent-name">Parent / Guardian name</label>
            <input type="text" id="parent-name" required maxlength="100">
        </div>

        <div id="children"></div>

        <button type="button" id="add-child">+ Add another child</button>

        <button type="submit" id="submit-button">
            Submit availability
        </button>
    </form>
</section>

        <section id="message" class="panel" hidden></section>
    </main>

    <footer>
        <p>Rushden & Higham Rugby Union Football Club</p>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
